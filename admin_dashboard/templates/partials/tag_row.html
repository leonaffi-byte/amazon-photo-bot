<tr id="tag-row-{{ tag.id }}" class="hover:bg-gray-50 transition-colors">
  <td class="px-4 py-3 font-mono text-gray-800">{{ tag.name }}</td>
  <td class="px-4 py-3">
    {% if tag.is_active %}
      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Active</span>
    {% else %}
      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">Inactive</span>
    {% endif %}
  </td>
  <td class="px-4 py-3 text-right text-gray-600">{{ tag.search_count }}</td>
  <td class="px-4 py-3">
    <div class="flex items-center gap-2">
      {% if tag.is_active %}
        <button hx-post="/admin/tags/{{ tag.id }}/deactivate"
                hx-target="#tag-row-{{ tag.id }}"
                hx-swap="outerHTML"
                class="text-xs px-2 py-1 border border-gray-300 rounded text-gray-600 hover:bg-gray-50 transition-colors">
          Deactivate
        </button>
      {% else %}
        <button hx-post="/admin/tags/{{ tag.id }}/activate"
                hx-target="#tag-row-{{ tag.id }}"
                hx-swap="outerHTML"
                class="text-xs px-2 py-1 border border-indigo-300 rounded text-indigo-600 hover:bg-indigo-50 transition-colors">
          Activate
        </button>
      {% endif %}
      <button hx-post="/admin/tags/{{ tag.id }}/remove"
              hx-target="#tag-row-{{ tag.id }}"
              hx-swap="outerHTML"
              hx-confirm="Remove this tag?"
              class="text-xs px-2 py-1 text-red-600 hover:text-red-800 transition-colors">
        Remove
      </button>
    </div>
  </td>
</tr>
