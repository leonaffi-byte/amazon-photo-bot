<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Amazon Photo Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Mobile hamburger button -->
  <button
    id="hamburger"
    class="md:hidden fixed top-4 left-4 z-50 p-2 bg-white rounded shadow text-gray-700"
    hx-get="/admin/partials/sidebar-toggle"
    hx-target="#sidebar"
    hx-swap="outerHTML">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Sidebar -->
  <nav id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-sm z-40 hidden md:block">
    <div class="p-6 border-b">
      <h1 class="text-lg font-semibold text-gray-800">Amazon Photo Bot</h1>
      <p class="text-xs text-gray-500 mt-1">Admin Panel</p>
    </div>
    <ul class="mt-4 space-y-1 px-3">
      <li>
        <a href="/admin/" class="flex items-center px-3 py-2 rounded-md text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
          <span class="text-sm font-medium">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/admin/tags" class="flex items-center px-3 py-2 rounded-md text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
          <span class="text-sm font-medium">Tags</span>
        </a>
      </li>
      <li>
        <a href="/admin/keys" class="flex items-center px-3 py-2 rounded-md text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
          <span class="text-sm font-medium">API Keys</span>
        </a>
      </li>
      <li>
        <a href="/admin/settings" class="flex items-center px-3 py-2 rounded-md text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
          <span class="text-sm font-medium">Settings</span>
        </a>
      </li>
      <li>
        <a href="/admin/health" class="flex items-center px-3 py-2 rounded-md text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
          <span class="text-sm font-medium">Health</span>
        </a>
      </li>
    </ul>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t">
      <a href="/admin/logout" class="block text-center text-sm text-gray-500 hover:text-red-600 transition-colors">
        Logout
      </a>
    </div>
  </nav>

  <!-- Main content -->
  <main class="md:ml-64 p-6 pt-16 md:pt-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
