<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'he' else 'ltr' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Amazon Photo Search{% endblock %}</title>

  {% block og_tags %}{% endblock %}

  <!-- Tailwind CSS CDN (Play) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>

  <!-- HTMX SSE extension -->
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/sse.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800">

  <!-- Site header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/?lang={{ lang }}" class="text-lg font-semibold text-gray-800 hover:text-gray-600">
        {{ t.site_title }}
      </a>
      <div class="flex gap-2 text-sm items-center">
        <a href="?lang=he" class="px-2 py-1 rounded {% if lang == 'he' %}font-bold text-indigo-600{% else %}text-gray-500 hover:text-gray-700{% endif %}">עברית</a>
        <span class="text-gray-300">|</span>
        <a href="?lang=en" class="px-2 py-1 rounded {% if lang == 'en' %}font-bold text-indigo-600{% else %}text-gray-500 hover:text-gray-700{% endif %}">English</a>
      </div>
    </div>
  </header>

  <!-- Page content -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-100 py-6 mt-auto">
    <div class="max-w-4xl mx-auto px-4 text-center text-xs text-gray-400">
      <p>{{ t.affiliate_disclosure }}</p>
    </div>
  </footer>

</body>
</html>
