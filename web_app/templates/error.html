{% extends "web_base.html" %}

{% block title %}{{ error_title }} — Amazon Photo Search{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-16 text-center">
  <div class="text-6xl mb-6">🔍</div>
  <h1 class="text-2xl font-bold text-gray-900 mb-3">{{ error_title }}</h1>
  <p class="text-gray-500 mb-8 max-w-sm">{{ error_message }}</p>
  <a href="/" class="inline-block bg-amber-500 hover:bg-amber-600 text-white font-semibold px-6 py-3 rounded-lg transition-colors">
    Search Again
  </a>
</div>
{% endblock %}
