<!-- Product tabs for multi-product navigation -->
<div class="flex overflow-x-auto gap-2 pb-1">
  {% for product in products %}
  <a
    href="?product={{ loop.index0 }}&lang={{ lang }}"
    class="flex-none px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors
           {% if loop.index0 == active_product_idx %}
             bg-indigo-600 text-white
           {% else %}
             bg-gray-100 text-gray-700 hover:bg-gray-200
           {% endif %}"
  >
    Product {{ loop.index }}: {{ product.product_name[:30] }}{% if product.product_name|length > 30 %}…{% endif %}
  </a>
  {% endfor %}
</div>
